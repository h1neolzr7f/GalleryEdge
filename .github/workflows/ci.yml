name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports: ["8080:8080"]
    env:
      GE_TEST_LIBSQL_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,panel,storage]"
      - name: wait for libsql
        run: for i in $(seq 60); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - run: pytest -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: worker typecheck + tests (against libsql service, seeded by Python)
        working-directory: packages/edge-worker/worker
        run: npm ci && npm run typecheck && npm test
  s3-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [minio, moto]
    env:
      GE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      GE_TEST_S3_KEY: FAKEminioadmin
      GE_TEST_S3_SECRET: FAKEminiosecret123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,panel,storage]" "moto[server]"
      - name: start MinIO
        if: matrix.server == 'minio'
        run: |
          docker run -d -p 9000:9000 -e MINIO_ROOT_USER=$GE_TEST_S3_KEY -e MINIO_ROOT_PASSWORD=$GE_TEST_S3_SECRET minio/minio server /data
          for i in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
      - name: start moto S3 server
        if: matrix.server == 'moto'
        run: |
          moto_server -p 9000 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:9000/ >/dev/null && break; sleep 1; done
      - run: pytest -q -rs tests/test_phase5_gaps.py -k s3_compatible
  panel-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: packages/panel/web
        run: npm ci && npm test && npm run build
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose --config .gitleaks.toml
