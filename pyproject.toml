[project]
name = "galleryedge"
version = "0.1.0"
description = "GalleryEdge ops toolkit (health, alerts, vault, backup, cleanup, config)"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "jsonschema>=4"]

[project.optional-dependencies]
libsql = ["libsql-experimental"]
dev = ["pytest>=7", "httpx>=0.27"]
panel = ["fastapi>=0.110", "uvicorn>=0.29"]
storage = ["boto3>=1.28"]

[project.scripts]
ge-ops = "galleryedge_ops.cli:main"
ge-demo-data = "galleryedge_demo.generate:main"
ge-demo = "galleryedge_edge.demo:main"
ge-panel = "galleryedge_panel.cli:main"
ge-crawl = "galleryedge_crawl.cli:main"
ge-ingest = "galleryedge_ingest:main"
ge-aitag = "galleryedge_aitag:main"
ge-keys = "galleryedge_edge.keys:main"
ge-cf-release = "galleryedge_ops.cfrelease:main"
ge-db-backup = "galleryedge_db.backup:main"
ge-demo-source = "galleryedge_demosource:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/panel", "packages/demo-data", "packages/db-turso", "packages/edge-worker", "packages/pack-format", "packages/ingest", "packages/crawler-core", "packages/crawler-adapters", "apps/demo-source", "packages/storage-router", "packages/aitag-bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/panel", "packages/demo-data", "packages/db-turso", "packages/edge-worker", "packages/pack-format", "packages/ingest", "packages/crawler-core", "packages/crawler-adapters", "apps/demo-source", "packages/storage-router", "packages/aitag-bridge"]
[tool.setuptools.package-data]
galleryedge_ops = ["schemas/*.json"]
